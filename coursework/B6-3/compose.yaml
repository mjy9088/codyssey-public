name: folio-lending
services:
  data-init:
    image: alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command: ["chmod", "0773", "/data"]
    network_mode: none
    read_only: true
    volumes:
      - catalog-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CATALOG_CSRF_SECRET: local-verification-secret-with-32-bytes
      CATALOG_DATABASE_URL: sqlite+pysqlite:////app/data/catalog.db
    init: true
    networks: [catalog]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - catalog-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    depends_on:
      data-init:
        condition: service_completed_successfully

  verify:
    profiles: [verify]
    build:
      context: .
      dockerfile: verify/Dockerfile
    environment:
      BASE_URL: http://app:8000
    init: true
    networks: [catalog]
    read_only: true
    shm_size: 1gb
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256

  vm:
    profiles: [vm]
    build:
      context: .
      dockerfile: verify/vm/Dockerfile
    init: true
    networks: [catalog]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256

networks:
  catalog:

volumes:
  catalog-data:
