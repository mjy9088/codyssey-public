[project]
name = "folio-lending"
version = "1.0.0"
description = "Session-authenticated FastAPI library lending service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.4",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "basedpyright==1.40.2",
  "nodejs-wheel-binaries==24.11.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_catalog"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportUnsafeMultipleInheritance = "none"
reportUnnecessaryComparison = "none"
reportIncompatibleVariableOverride = "none"
reportImportCycles = "none"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "FBT001", "FBT002", "ISC001", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"src/book_catalog/models/{loan,session}.py" = ["TC003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Path", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
