[project]
name = "mini-redis"
version = "1.0.0"
requires-python = ">=3.11"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["src", "tests"]
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "T201"]

[tool.ruff.format]
quote-style = "double"
