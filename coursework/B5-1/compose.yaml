services:
  mini-redis:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stdin_open: true

  test:
    profiles: [verify]
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, tests/run.py]

  vm:
    profiles: [vm]
    build:
      context: .
      dockerfile: verify/vm/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
