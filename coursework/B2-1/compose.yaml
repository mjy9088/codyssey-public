services:
  ledger:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs: [/tmp]
    volumes: [ledger-data:/app/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  verify:
    profiles: [verify]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [python, -m, unittest, discover, -s, tests, -v]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  vm:
    profiles: [vm]
    build:
      context: .
      dockerfile: verify/vm/Dockerfile
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  ledger-data:
