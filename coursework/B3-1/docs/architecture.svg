<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <title>Candidate AWS web-service topology</title>
  <desc>An Internet client reaches an internet gateway, a public subnet route, a restricted security group and a web instance in a VPC. This is a design, not deployment evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#24463c" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="620" fill="#f8f7f2"/>
  <g font-family="sans-serif" fill="#172720">
    <text x="48" y="54" font-size="30" font-weight="bold">Small web-service topology</text>
    <text x="48" y="88" font-size="17">Design reference only. No real cloud deployment is claimed.</text>
    <rect x="40" y="220" width="165" height="110" rx="10" fill="#ffffff" stroke="#24463c" stroke-width="2"/>
    <text x="70" y="268" font-size="22">Internet</text><text x="70" y="298" font-size="17">review client</text>
    <rect x="430" y="125" width="720" height="420" rx="12" fill="#e7f1eb" stroke="#24463c" stroke-width="2"/>
    <text x="455" y="166" font-size="23">VPC 10.42.0.0/16</text><text x="915" y="166" font-size="18">ap-northeast-2</text>
    <rect x="275" y="225" width="190" height="100" rx="10" fill="#ffffff" stroke="#24463c" stroke-width="2"/>
    <text x="297" y="267" font-size="21">Internet gateway</text><text x="300" y="298" font-size="16">attached to VPC</text>
    <rect x="520" y="210" width="580" height="280" rx="10" fill="#ffffff" stroke="#60776b" stroke-width="2"/>
    <text x="548" y="249" font-size="21">Public subnet 10.42.1.0/24</text>
    <text x="548" y="284" font-size="17">Route: 0.0.0.0/0 → internet gateway</text>
    <rect x="745" y="322" width="315" height="125" rx="8" fill="#d4e5dd" stroke="#24463c" stroke-width="2"/>
    <text x="770" y="360" font-size="22">EC2 web instance</text>
    <text x="770" y="393" font-size="17">Nginx · /health · IMDSv2</text><text x="770" y="424" font-size="17">Encrypted, disposable root disk</text>
    <text x="545" y="342" font-size="18">Security group</text><text x="545" y="376" font-size="16">HTTP: 80 public</text><text x="545" y="407" font-size="16">SSH: trusted /32</text>
    <path d="M205 275H270M465 275H510M694 378H738" fill="none" stroke="#24463c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="585" font-size="18">Control plane: reviewed non-root IAM identity, scoped actions, region and ownership conditions.</text>
  </g>
</svg>
