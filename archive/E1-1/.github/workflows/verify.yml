name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run executable documentation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .local/evidence
          bash lab.bash run 2>&1 | tee .local/evidence/lab.log

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workstation-evidence
          path: .local/evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop workstation
        if: always()
        run: bash lab.bash down
